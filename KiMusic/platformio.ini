[env:esp32-s3-devkitc-1]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; Gera wokwi-sd/ (cartao do simulador) a partir de SD/ antes de compilar
extra_scripts = pre:tools/wokwi_sd.py

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    lvgl/lvgl@8.3.11
    ; 1.9.7: ultima versao para o core Arduino-ESP32 2.0.x (driver I2S antigo)
    earlephilhower/ESP8266Audio@1.9.7
    ; capas: JPEG (comum e progressivo) e PNG, decodificados aos poucos
    bitbank2/JPEGDEC@1.8.4
    bitbank2/PNGdec@1.1.6

; USB nativa no modo TinyUSB (o modo USB/pendrive precisa); o Serial continua na porta UART
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=9
    -D TFT_RST=14
    -D SPI_FREQUENCY=27000000
    -D DISABLE_ALL_LIBRARY_WARNINGS=1
    ; PNGdec: 2 linhas RGBA de ate 1500 px (CoverDecoder::MAX_PNG_WIDTH)
    -D PNG_MAX_BUFFERED_PIXELS=12002
    ; JPEGDEC sem SIMD do S3: o Wokwi nao emula essas instrucoes (IllegalInstruction em
    ; capa sem reducao, ex. 140 px) e numa capa pequena o ganho e desprezivel
    -D NO_SIMD
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -I src
    -D LV_CONF_INCLUDE_SIMPLE

; Firmware do Wokwi (wokwi.toml): igual, mas sem audio. O Wokwi nao emula o I2S do
; ESP32-S3 (o 1o Play travava a placa com "Interrupt wdt timeout on CPU1") e decodificar
; MP3 no simulador derrubava a velocidade para ~5%. Sem audio o Player conta o tempo sozinho.
[env:wokwi]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D KIMUSIC_NO_AUDIO
