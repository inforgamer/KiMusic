[env:esp32-s3-devkitc-1]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    lvgl/lvgl@8.3.11
    ; 1.9.7: ultima versao para o core Arduino-ESP32 2.0.x (driver I2S antigo)
    earlephilhower/ESP8266Audio@1.9.7
    ; capas: JPEG (comum e progressivo) e PNG, decodificados aos poucos
    bitbank2/JPEGDEC@1.8.4
    bitbank2/PNGdec@1.1.6

build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=9
    -D TFT_RST=14
    -D SPI_FREQUENCY=27000000
    -D DISABLE_ALL_LIBRARY_WARNINGS=1
    ; PNGdec: 2 linhas RGBA de ate 1500 px (CoverDecoder::MAX_PNG_WIDTH)
    -D PNG_MAX_BUFFERED_PIXELS=12002
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -I src
    -D LV_CONF_INCLUDE_SIMPLE